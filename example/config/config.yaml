dependencies:
  - static:
      package: dart:js_interop
      types:
        - JS
        - JSAny
        - JSArray
        - JSArrayBuffer
        - JSBigInt
        - JSBoolean
        - JSFloat32Array
        - JSFloat64Array
        - JSFunction
        - JSInt8Array
        - JSInt16Array
        - JSInt32Array
        - JSNumber
        - JSObject
        - JSPromise
        - JSString
        - JSSymbol
        - JSUint8Array
        - JSUint8ClampedArray
        - JSUint16Array
        - JSUint32Array
  - pubDev:
      package: web
      library: web
  - pubDev:
      package: es2023
      library: es2023
  - pubDev:
      package: webxr
      library: webxr
sanitizer:
  phases:
    - typeLiterals
    - literalAsTypeArgument
    - mergeModules
    - mergeInterfaces
    - mergeInterfacesIntoClasses
    - missingTypeArgsAndParams
    - constructorInterfaces
    - invalidIdentifiers
    - underscoreIdentifiers
    - duplicateNameTypeAliases